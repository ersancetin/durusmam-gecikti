name = "durusmam-gecikti"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

[vars]
# Cloudflare Turnstile site anahtarı (herkese açık). Boş bırakılırsa bot doğrulaması kapalıdır.
# Gizli anahtar: npx wrangler pages secret put TURNSTILE_SECRET
TURNSTILE_SITE_KEY = ""

[[d1_databases]]
binding = "DB"
database_name = "durusmam-gecikti"
# `npx wrangler d1 create durusmam-gecikti` çıktısındaki kimliği buraya yazın.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
