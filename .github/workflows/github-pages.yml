# public/ klasörünü GitHub Pages'e yayınlar.
# GitHub Pages yalnızca statik dosya sunar; bildirim ve rapor API'si (functions/ + D1)
# Cloudflare'de çalışır ve adresi depo değişkeni API_URL ile bağlanır.
name: GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-yayin
  cancel-in-progress: true

jobs:
  yayinla:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagitim.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: API adresini yaz
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -n "$API_URL" ]; then
            sed -i "s|^export const API_TABANI = \"\";|export const API_TABANI = \"${API_URL%/}\";|" public/assets/js/ayar.js
          fi
          cat public/assets/js/ayar.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: dagitim
        uses: actions/deploy-pages@v4
